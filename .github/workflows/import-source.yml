name: Import verified Android source
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  import-source:
    if: ${{ github.event.issue.number == 1 && github.event.comment.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source ZIP
        env:
          EXPECTED_SHA256: 'd3d1ec261496b43dd7045e76e357c9b5bd58698b06b657d6e4743995cdf6ebde'
          ROOT_PREFIX: ''
          REQUIRED_MANIFEST: 'android/app/src/main/AndroidManifest.xml'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, stat, urllib.request, zipfile
          from urllib.parse import urlparse
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          comment = event["comment"]["body"]
          urls = re.findall(r"https://github\.com/user-attachments/(?:files|assets)/[a-zA-Z0-9_.%/\-]+", comment)
          if len(urls) != 1:
              raise SystemExit("Post exactly one GitHub ZIP attachment URL in the issue comment.")
          url = urls[0]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.netloc != "github.com":
              raise SystemExit("Invalid attachment source.")
          req = urllib.request.Request(url, headers={"User-Agent": "source-import-verifier"})
          with urllib.request.urlopen(req, timeout=90) as response:
              payload = response.read(20_000_001)
          if len(payload) > 20_000_000:
              raise SystemExit("Archive is too large.")
          actual = hashlib.sha256(payload).hexdigest()
          if actual != os.environ["EXPECTED_SHA256"]:
              raise SystemExit("Archive SHA-256 did not match the prepared source ZIP.")
          repo_root = pathlib.Path.cwd().resolve()
          prefix = os.environ["ROOT_PREFIX"]
          count = 0
          size = 0
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  name = item.filename
                  if prefix:
                      if not name.startswith(prefix):
                          raise SystemExit("Unexpected archive root.")
                      name = name[len(prefix):]
                  # Workflow-file changes require permissions unavailable to the Actions token.
                  # Import verified application source; add CI as a separate owner commit.
                  if name.startswith(".github/workflows/"):
                      continue
                  path = pathlib.PurePosixPath(name)
                  if not name or path.is_absolute() or ".." in path.parts or "\\" in name:
                      raise SystemExit("Unsafe source path.")
                  if any(segment == ".git" for segment in path.parts):
                      raise SystemExit("Git metadata is not allowed in source archive.")
                  if ((item.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit("Archive symlinks are not allowed.")
                  if path.name in {".env", "local.properties"} or path.suffix.lower() in {".jks", ".keystore", ".p12", ".pfx", ".pem", ".key"}:
                      raise SystemExit("Signing credentials must not be uploaded.")
                  out = (repo_root / name).resolve()
                  if not out.is_relative_to(repo_root):
                      raise SystemExit("Archive path escapes repository.")
                  count += 1
                  size += item.file_size
                  if count > 1500 or size > 50_000_000 or item.file_size > 10_000_000:
                      raise SystemExit("Archive exceeds size or file-count safety limits.")
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(item))
          if not (repo_root / os.environ["REQUIRED_MANIFEST"]).is_file():
              raise SystemExit("Expected AndroidManifest.xml not present.")
          for filename in ["android/gradlew", "build-local.sh"]:
              p = repo_root / filename
              if p.exists():
                  p.chmod(p.stat().st_mode | 0o111)
          print("Verified SHA-256 and imported", count, "source files.")
          PY
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Import verified Android source project"; git push origin HEAD:main; fi
