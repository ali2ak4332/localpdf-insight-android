name: Android Debug Build and Lint
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localpdf-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
