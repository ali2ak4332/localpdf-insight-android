[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localpdf-insight"
version = "0.2.0"
description = "Private, local-first PDF library and evidence-grounded browser and desktop reader"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
]

[project.scripts]
localpdf-insight = "localpdf_insight.web:main"
localpdf-insight-desktop = "localpdf_insight.ui:main"

[project.optional-dependencies]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]
desktop = ["PySide6>=6.7,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.package-data]
localpdf_insight = ["static/**/*", "static/*"]
